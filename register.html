{% extends "base.html" %}{% block content %}
<h2>Register Student</h2><p class="text-muted">Upload a clear photo containing exactly one face.</p>
<div class="card p-4" style="max-width:700px"><form method="post" enctype="multipart/form-data">
<div class="mb-3"><label class="form-label">Registration Number</label><input class="form-control" name="reg_no" required></div>
<div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" name="name" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email"></div>
<div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
<div class="mb-3"><label class="form-label">Face Photo</label><input class="form-control" type="file" name="photo" accept=".jpg,.jpeg,.png" required></div>
<button class="btn btn-primary">Register Student</button></form></div>{% endblock %}
