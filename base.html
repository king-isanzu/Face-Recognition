<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb}.sidebar{min-height:100vh;background:#111827}.sidebar a{color:#d1d5db;text-decoration:none;display:block;padding:12px 18px;border-radius:8px;margin:4px}.sidebar a:hover{background:#374151;color:white}.card{border:0;box-shadow:0 3px 15px #0000000b}.brand{font-weight:700;color:white;padding:20px}
</style></head>
<body>
<div class="container-fluid"><div class="row">
<aside class="col-md-2 sidebar p-2">
<div class="brand">📷 Face Attendance</div>
<a href="/">Dashboard</a><a href="/students">Students</a><a href="/students/add">Register Student</a>
<a href="/scan">Scan Attendance</a><a href="/attendance">Attendance</a><a href="/reports">Reports</a>
</aside>
<main class="col-md-10 p-4">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,msg in messages %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main></div></div>
</body></html>
